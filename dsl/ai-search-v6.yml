          content\", \"\"))\n    ordered_values = extract_ordered_values(item.get(\"content\", \"\"))\n    course_id = pick_first(\n        item.get(\"course_id\"),\n        item.get(\"id\"),\n        parsed.get(\"course_id\"),\n        parsed.get(\"产品编码\"),\n        ordered_values[0] if len(ordered_values) > 0 else \"\"\n    )\n    course_name_full = pick_first(\n        item.get(\"course_name_full\"),\n        item.get(\"course_name\"),\n        item.get(\"name\"),\n        parsed.get(\"course_name_full\"),\n        parsed.get(\"course_name\"),\n        parsed.get(\"课程名称\"),\n        ordered_values[1] if len(ordered_values) > 1 else \"\"\n    )\n    course_highlight_text = pick_first(\n        item.get(\"course_highlight_text\"),\n        item.get(\"highlight_text\"),\n        item.get(\"highlight\"),\n        item.get(\"summary\"),\n        parsed.get(\"course_highlight_text\"),\n        parsed.get(\"亮点介绍\"),\n        ordered_values[2] if len(ordered_values) > 2 else \"\"\n    )\n\n \
          \   if not (course_id or course_name_full or course_highlight_text):\n        return None\n\n    return {\n        \"course_id\": course_id,\n        \"course_name_full\": course_name_full,\n        \"course_highlight_text\": course_highlight_text\n    }\n\ndef extract_list(payload):\n    if isinstance(payload, list):\n        return payload\n    if not isinstance(payload, dict):\n        return []\n\n    candidates = [\n        payload.get(\"body\"),\n        payload.get(\"list\"),\n        payload.get(\"data\")\n    ]\n\n    body_obj = payload.get(\"body\")\n    if isinstance(body_obj, dict):\n        candidates.extend([\n            body_obj.get(\"body\"),\n            body_obj.get(\"list\"),\n            body_obj.get(\"data\")\n        ])\n\n    for value in candidates:\n        if isinstance(value, list):\n            return value\n    return []\n\ndef main(body=None):\n    payload = {}\n    if isinstance(body, str) and body:\n        try:\n            payload = json.loads(body)\n\
          \        except Exception:\n            payload = {}\n    elif isinstance(body, list):\n        payload = body\n    elif isinstance(body, dict):\n        payload = body\n\n    raw_list = extract_list(payload)\n    normalized_list = []\n    for raw_item in raw_list:\n        normalized = normalize_item(raw_item)\n        if normalized:\n            normalized_list.append(normalized)\n\n    count = len(normalized_list)\n    if count == 0:\n        return {\n            \"kb_hit\": False,\n            \"kb_match_count\": \"0\",\n            \"kb_course_id\": \"\",\n            \"kb_course_name_full\": \"\",\n            \"kb_course_highlight_text\": \"\",\n            \"kb_course_options\": \"\",\n            \"kb_match_state\": \"none\"\n        }\n\n    top_item = normalized_list[0]\n    options = []\n    if count > 1:\n        for item in normalized_list:\n            course_name_full = str(item.get(\"course_name_full\", \"\") or \"\")\n            course_id = str(item.get(\"course_id\"\
          , \"\") or \"\")\n            if course_name_full:\n                options.append(f\"- ${course_name_full}（ID：${course_id}）\" if course_id else f\"- ${course_name_full}\")\n\n    return {\n        \"kb_hit\": True,\n        \"kb_match_count\": str(count),\n        \"kb_course_id\": str(top_item.get(\"course_id\", \"\") or \"\"),\n        \"kb_course_name_full\": str(top_item.get(\"course_name_full\", \"\") or \"\"),\n        \"kb_course_highlight_text\": str(top_item.get(\"course_highlight_text\", \"\") or \"\"),\n        \"kb_course_options\": \"\\n\".join(options),\n        \"kb_match_state\": \"single\" if count == 1 else \"multiple\"\n    }"
